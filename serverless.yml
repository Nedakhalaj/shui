org: ${file(./config.yml):org}
service: shui

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}

  environment:
    JWT_SECRET: ${file(./config.yml):jwtSecret}

functions:
  register:
    handler: functions/register/index.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST
  login:
    handler: functions/login/index.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST
  createPost:
    handler: functions/createPost/index.handler
    events:
      - httpApi:
          path: /posts
          method: POST
  getPosts:
    handler: functions/get-posts/index.handler
    events:
      - httpApi:
          path: /posts
          method: GET
  getPostById:
    handler: functions/getPostById/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: GET
  updatePost:
    handler: functions/updatePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: PUT

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: shui-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH

    PostsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: shui-posts
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
